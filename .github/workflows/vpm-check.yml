name: Check VCC package
on:
  pull_request:
  push:
    branches: [main, refactor/unity-v1.0.0, feat/vcc-repository]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/verify_repository.py
      - run: python3 -m unittest discover -s scripts -p 'test_vpm.py'
      - run: python3 scripts/build_vpm.py build --output "${{ runner.temp }}/vpm"
      - uses: actions/upload-artifact@v4
        with:
          name: vpm-package-preview
          path: ${{ runner.temp }}/vpm/*.zip
