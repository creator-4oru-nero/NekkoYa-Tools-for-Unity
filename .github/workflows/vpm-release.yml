name: Publish VCC repository
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vpm-publication
  cancel-in-progress: false
jobs:
  package:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/verify_repository.py
      - run: python3 -m unittest discover -s scripts -p 'test_vpm.py'
      - name: Build and attach package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/build_vpm.py build --output "$RUNNER_TEMP/vpm" --tag "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/vpm/*.zip
  listing:
    needs: package
    if: always() && (needs.package.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build listing from published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build_vpm.py index --output "$RUNNER_TEMP/site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - uses: actions/deploy-pages@v4
        id: deployment
